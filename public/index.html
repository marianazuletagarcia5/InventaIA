<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>InventIA</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#A6192E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="InventIA">
<link rel="apple-touch-icon" href="/iconos/icono-192.png">
<link rel="icon" href="/iconos/icono-192.png">
<style>
  :root{
    --negro:#181818; --negro-suave:#2C2C2C;
    --rojo:#A6192E; --rojo-fuerte:#7F1223; --rojo-claro:#E9B9C0; --rojo-suave-bg:#FBEBEC;
    --crema:#F7F7F7; --blanco:#FFFFFF;
    --texto:#1A1A1A; --texto-suave:#5A5A5A; --linea:#E3E3E3;
    --verde:#2E7D4F; --verde-bg:#E7F4EC; --ambar:#B5822A; --ambar-bg:#FBF1E1;
    --malo:#8C1D26; --malo-bg:#F8E3E5; --gris:#8A8A8A; --gris-bg:#EFEFEF;
    --radio:14px; --sombra:0 2px 12px rgba(0,0,0,0.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0;font-family:'Segoe UI',Arial,Helvetica,sans-serif;background:var(--crema);color:var(--texto);
    -webkit-user-select:none; user-select:none; overscroll-behavior:none;}
  input, textarea{-webkit-user-select:text; user-select:text;}
  h1,h2,h3{font-family:Georgia,'Times New Roman',serif;color:var(--negro);margin:0;}
  button{font-family:inherit;}

  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;background:var(--crema);position:relative;}

  .topbar{display:flex;align-items:center;gap:10px;padding:14px 18px;padding-top:max(14px, env(safe-area-inset-top));
    background:var(--negro);color:#fff;position:sticky;top:0;z-index:20;}
  .topbar img{width:32px;height:32px;border-radius:8px;background:#fff;padding:2px;}
  .topbar h1{font-size:19px;color:#fff;}
  .topbar .estado-conexion{margin-left:auto;font-size:11px;color:var(--rojo-claro);}

  .contenido{flex:1;overflow-y:auto;padding:18px 18px 100px 18px;}
  .pantalla{display:none;}
  .pantalla.activa{display:block;animation:fade .15s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}

  .navbar{display:flex;position:sticky;bottom:0;background:#fff;border-top:1px solid var(--linea);
    padding-bottom:env(safe-area-inset-bottom); z-index:20;}
  .navbar button{flex:1;background:none;border:none;padding:10px 4px 8px 4px;display:flex;flex-direction:column;
    align-items:center;gap:3px;color:var(--texto-suave);font-size:11.5px;cursor:pointer;}
  .navbar button .icono{font-size:23px;line-height:1;}
  .navbar button.activo{color:var(--rojo);font-weight:700;}

  .tarjeta{background:#fff;border-radius:var(--radio);padding:20px;box-shadow:var(--sombra);margin-bottom:16px;}
  .btn-grande{width:100%;padding:18px;border-radius:var(--radio);border:none;font-size:17px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;}
  .btn-grande.rojo{background:var(--rojo);color:#fff;}
  .btn-grande.negro{background:var(--negro);color:#fff;}
  .btn-grande.linea{background:#fff;color:var(--negro);border:2px solid var(--linea);}
  .btn-grande:active{transform:scale(.98);}
  .btn-texto{background:none;border:none;color:var(--rojo);font-size:15px;font-weight:600;padding:10px;cursor:pointer;text-align:center;width:100%;}

  .zona-camara{width:100%;border-radius:var(--radio);overflow:hidden;background:#000;min-height:260px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .zona-camara.vacia{flex-direction:column;color:rgba(255,255,255,.7);gap:10px;}
  .zona-camara.vacia .icono-camara{font-size:52px;}
  #lector-camara-interno{width:100%;}
  .caja-manual{display:flex;gap:8px;margin-top:6px;}
  .caja-manual input{flex:1;padding:14px;border:2px solid var(--linea);border-radius:12px;font-size:16px;}
  .caja-manual button{padding:0 18px;border-radius:12px;border:none;background:var(--negro);color:#fff;font-weight:700;font-size:15px;}

  .badge-estado{display:inline-block;padding:6px 14px;border-radius:20px;font-weight:700;font-size:13.5px;}
  .badge-estado.Bueno{background:var(--verde-bg);color:var(--verde);}
  .badge-estado.Regular{background:var(--ambar-bg);color:var(--ambar);}
  .badge-estado.Malo{background:var(--malo-bg);color:var(--malo);}
  .badge-estado.DeBaja{background:var(--gris-bg);color:var(--gris);}
  .fila-dato{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--linea);font-size:14.5px;}
  .fila-dato:last-child{border-bottom:none;}
  .fila-dato span:first-child{color:var(--texto-suave);}
  .fila-dato span:last-child{font-weight:600;text-align:right;}
  .cod-grande{font-family:'Courier New',monospace;font-weight:700;color:var(--rojo-fuerte);font-size:15px;}

  .grid-estados{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .tile-estado{padding:16px 8px;border-radius:12px;border:2px solid transparent;font-weight:700;font-size:15px;cursor:pointer;text-align:center;}
  .tile-estado.Bueno{background:var(--verde-bg);color:var(--verde);}
  .tile-estado.Regular{background:var(--ambar-bg);color:var(--ambar);}
  .tile-estado.Malo{background:var(--malo-bg);color:var(--malo);}
  .tile-estado.DeBaja{background:var(--gris-bg);color:var(--gris);}
  .tile-estado.seleccionado{border-color:currentColor;}

  .puntos-progreso{display:flex;justify-content:center;gap:7px;margin-bottom:20px;}
  .puntos-progreso span{width:8px;height:8px;border-radius:50%;background:var(--linea);}
  .puntos-progreso span.activo{background:var(--rojo);width:22px;border-radius:5px;}
  .titulo-paso{font-size:21px;margin-bottom:6px;}
  .subtitulo-paso{color:var(--texto-suave);font-size:14px;margin-bottom:20px;}
  .grid-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
  .tile-opcion{background:#fff;border:2px solid var(--linea);border-radius:var(--radio);padding:20px 10px;
    display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:14px;text-align:center;}
  .tile-opcion .emoji{font-size:30px;}
  .tile-opcion.seleccionado{border-color:var(--rojo);background:var(--rojo-suave-bg);color:var(--rojo-fuerte);}
  .campo{margin-bottom:16px;}
  .campo label{display:block;font-size:13px;color:var(--texto-suave);margin-bottom:6px;font-weight:600;}
  .campo input, .campo textarea{width:100%;padding:14px;border:2px solid var(--linea);border-radius:12px;font-size:16px;font-family:inherit;}
  .stepper{display:flex;align-items:center;gap:16px;justify-content:center;margin-top:8px;}
  .stepper button{width:46px;height:46px;border-radius:50%;border:2px solid var(--linea);background:#fff;font-size:22px;font-weight:700;color:var(--negro);}
  .stepper .valor{font-size:26px;font-weight:700;min-width:50px;text-align:center;}
  .fila-botones-wizard{display:flex;gap:10px;margin-top:24px;}
  .fila-botones-wizard .btn-grande{flex:1;}

  .buscador{width:100%;padding:14px 16px;border:2px solid var(--linea);border-radius:14px;font-size:16px;margin-bottom:12px;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .chip-filtro{flex-shrink:0;padding:9px 16px;border-radius:20px;border:2px solid var(--linea);background:#fff;font-size:13.5px;font-weight:600;color:var(--texto-suave);white-space:nowrap;}
  .chip-filtro.activo{background:var(--negro);border-color:var(--negro);color:#fff;}
  .tarjeta-recurso{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--sombra);display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .tarjeta-recurso .info{min-width:0;}
  .tarjeta-recurso .nombre{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tarjeta-recurso .meta{font-size:12.5px;color:var(--texto-suave);margin-top:2px;}
  .punto-estado{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .punto-estado.Bueno{background:var(--verde);} .punto-estado.Regular{background:var(--ambar);}
  .punto-estado.Malo{background:var(--malo);} .punto-estado.DeBaja{background:var(--gris);}

  .vacio{text-align:center;padding:60px 20px;color:var(--texto-suave);}
  .vacio .icono{font-size:44px;margin-bottom:14px;}

  .qr-final{background:#fff;border-radius:var(--radio);padding:24px;text-align:center;box-shadow:var(--sombra);}
  .qr-final canvas{margin:0 auto;}
  .qr-final .codigo{font-family:'Courier New',monospace;font-size:22px;font-weight:700;color:var(--rojo-fuerte);margin:12px 0;}

  .opcion-mas{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:10px;box-shadow:var(--sombra);cursor:pointer;border:none;width:100%;text-align:left;font-size:15px;font-weight:600;color:var(--texto);}
  .opcion-mas .emoji{font-size:22px;}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--negro);color:#fff;
    padding:12px 22px;border-radius:30px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90%;text-align:center;}
  .toast.mostrar{opacity:1;transform:translateX(-50%) translateY(0);}

  .hoja-fondo{position:fixed;inset:0;background:rgba(24,24,24,.5);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .hoja-fondo.activo{display:flex;}
  .hoja{background:#fff;border-radius:20px 20px 0 0;padding:22px 20px max(22px, env(safe-area-inset-bottom)) 20px;width:100%;max-width:520px;box-shadow:0 -4px 24px rgba(0,0,0,.2);}
  .hoja .manija{width:40px;height:4px;background:var(--linea);border-radius:2px;margin:0 auto 16px auto;}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <img src="/escudo.jpeg" alt="Escudo">
    <h1>InventIA</h1>
    <span class="estado-conexion" id="estado-conexion">conectando…</span>
  </div>

  <div class="contenido">

    <!-- ESCANEAR -->
    <section class="pantalla activa" id="pantalla-escanear">
      <div class="zona-camara vacia" id="zona-camara">
        <div id="lector-camara-interno" style="display:none;"></div>
        <div id="placeholder-camara">
          <div class="icono-camara">📷</div>
          <div>Apunta la cámara al código QR</div>
        </div>
      </div>
      <button class="btn-grande rojo" id="btn-iniciar-camara">📷 Activar cámara</button>
      <button class="btn-grande linea" id="btn-detener-camara" style="display:none;margin-top:10px;">Detener cámara</button>

      <div class="caja-manual">
        <input type="text" id="codigo-manual" placeholder="O escribe el código: INV-2026-0001">
        <button id="btn-buscar-manual">Buscar</button>
      </div>

      <div id="resultado-escaneo" style="margin-top:18px;"></div>
    </section>

    <!-- AGREGAR (wizard) -->
    <section class="pantalla" id="pantalla-agregar">
      <div class="puntos-progreso" id="puntos-progreso"></div>
      <div id="contenido-wizard"></div>
    </section>

    <!-- INVENTARIO -->
    <section class="pantalla" id="pantalla-inventario">
      <input type="text" class="buscador" id="buscar" placeholder="🔍 Buscar recurso, salón o código...">
      <div class="chips" id="chips-area">
        <button class="chip-filtro activo" data-area="">Todas las áreas</button>
        <button class="chip-filtro" data-area="ZAGALITOS">Zagalitos</button>
        <button class="chip-filtro" data-area="ZAGALES">Zagales</button>
        <button class="chip-filtro" data-area="JUVAM">Juvam</button>
        <button class="chip-filtro" data-area="ADMINISTRATIVO">Administrativo</button>
      </div>
      <div id="lista-inventario"></div>
    </section>

    <!-- MÁS -->
    <section class="pantalla" id="pantalla-mas">
      <h2 style="margin-bottom:16px;">Más opciones</h2>
      <button class="opcion-mas" id="btn-ver-panel"><span class="emoji">📊</span> Ver panel completo (administración)</button>
      <button class="opcion-mas" id="btn-descargar-csv"><span class="emoji">📁</span> Descargar reporte (CSV)</button>
      <button class="opcion-mas" id="btn-descargar-json"><span class="emoji">💾</span> Descargar copia de seguridad</button>
      <div class="tarjeta" style="margin-top:20px;">
        <h3 style="font-size:15px;margin-bottom:8px;">Acerca de InventIA</h3>
        <p style="font-size:13.5px;color:var(--texto-suave);line-height:1.5;margin:0;">
          Sistema inteligente de gestión de inventario del Instituto Técnico San Rafael, basado en códigos QR.
          Trabajo de grado — Grado 11.
        </p>
      </div>
    </section>

  </div>

  <nav class="navbar" id="navbar">
    <button data-pantalla="escanear" class="activo"><span class="icono">📷</span>Escanear</button>
    <button data-pantalla="agregar"><span class="icono">➕</span>Agregar</button>
    <button data-pantalla="inventario"><span class="icono">📋</span>Inventario</button>
    <button data-pantalla="mas"><span class="icono">⋯</span>Más</button>
  </nav>

  <div class="hoja-fondo" id="hoja-fondo">
    <div class="hoja" id="hoja-contenido"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/mobile.js"></script>
</body>
</html>
